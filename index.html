<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rank Change Request</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: opacity 0.5s ease;
        }
        .loading {
            text-align: center;
            color: #4f46e5;
        }
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 350px;
            opacity: 0; /* Hidden until IP check passes */
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, select, textarea, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: #4338ca;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .ip-info {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="loadingScreen" class="loading">
        <h2>Checking Access...</h2>
        <p>Verifying your IP address. Please wait.</p>
    </div>

    <div id="formContainer" class="form-container" style="display: none;">
        <h2>Rank Change Request</h2>
        <form id="rankForm">
            <label for="requestType">Request Type</label>
            <select id="requestType" name="requestType" required>
                <option value="">Select Type</option>
                <option value="Promotion">Promotion</option>
                <option value="Demotion">Demotion</option>
                <option value="Resign">Resign</option>
            </select>

            <label for="discordId">Discord ID</label>
            <input type="text" id="discordId" name="discordId" placeholder="e.g., 123456789012345678" required>
            <div id="discordError" class="error">Discord ID must be a valid number (17-19 digits).</div>

            <label for="mention">IGN (In-game name)</label>
            <input type="text" id="mention" name="mention" required>

            <label for="currentRank">Current Rank</label>
            <input type="text" id="currentRank" name="currentRank" required>

            <label for="updatedRank">Updated Rank</label>
            <input type="text" id="updatedRank" name="updatedRank" required>

            <label for="reason">Reason</label>
            <textarea id="reason" name="reason" rows="3" placeholder="Explain why..." required></textarea>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <div id="passwordError" class="error">Incorrect password.</div>

            <button type="submit" id="submitBtn">Submit Request</button>
        </form>
        <div id="ipInfo" class="ip-info"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
